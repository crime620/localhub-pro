<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | LocalHub</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css">
</head>
<body class="dark-theme">

    <nav class="navbar glass">
        <div class="logo">
            <i class="fas fa-location-dot"></i> LocalHub
        </div>

        <div class="nav-links">
            <span>Hi, {{ user }}</span>
            <a href="/favorites">Favorites</a>
            <a href="/admin">Admin</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>

    <section class="dashboard-container">

        <div class="top-grid">
            <div class="glass location-card">
                <h2><i class="fas fa-location-crosshairs"></i> Current Location</h2>
                <p id="locationText">Detecting your location...</p>
            </div>

            <div class="glass weather-card">
                <h2><i class="fas fa-cloud-sun"></i> Weather</h2>
                <p id="weatherText">Loading weather...</p>
            </div>
        </div>

        <div class="glass map-card">
            <h2><i class="fas fa-map"></i> Live Map</h2>
            <div id="map"></div>
        </div>

        <div class="category-grid">
            <div class="glass category-card" onclick="loadPlaces('restaurant')">
                <i class="fas fa-utensils"></i>
                <h3>Restaurants</h3>
            </div>

            <div class="glass category-card" onclick="loadPlaces('hospital')">
                <i class="fas fa-hospital"></i>
                <h3>Hospitals</h3>
            </div>

            <div class="glass category-card" onclick="loadPlaces('hotel')">
                <i class="fas fa-hotel"></i>
                <h3>Hotels</h3>
            </div>

            <div class="glass category-card" onclick="loadPlaces('bank')">
                <i class="fas fa-building-columns"></i>
                <h3>Banks</h3>
            </div>
        </div>

        <div class="glass places-card">
            <h2><i class="fas fa-compass"></i> Nearby Results</h2>
            <div id="placesContainer">
                Click a category to load nearby places...
            </div>
        </div>

    </section>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
